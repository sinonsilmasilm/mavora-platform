name: Encrypted daily MAVORA database backup

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavora-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client age awscli

      - name: Validate required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test -n "$AGE_RECIPIENT"
          test -n "$BACKUP_S3_ENDPOINT"
          test -n "$BACKUP_S3_BUCKET"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"

      - name: Dump and encrypt database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          pg_dump --format=custom --no-owner --no-acl "$SUPABASE_DB_URL" | age -r "$AGE_RECIPIENT" -o mavora-db-${{ github.run_id }}.dump.age
          test -s mavora-db-${{ github.run_id }}.dump.age
          sha256sum mavora-db-${{ github.run_id }}.dump.age > mavora-db-${{ github.run_id }}.sha256

      - name: Upload encrypted backup to private S3-compatible storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y/%m/%d)"
          aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp "mavora-db-${{ github.run_id }}.dump.age" "s3://$BACKUP_S3_BUCKET/mavora/$DATE/mavora-db-${{ github.run_id }}.dump.age" --sse AES256
          aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp "mavora-db-${{ github.run_id }}.sha256" "s3://$BACKUP_S3_BUCKET/mavora/$DATE/mavora-db-${{ github.run_id }}.sha256" --sse AES256
